# Cut a GitHub Release when scripts/release.sh pushes a tag.
#
# There is no package to build: fleet is installed by ./install, which symlinks
# the working tree. So this exists to do the two things a tag alone does not —
# prove the tagged commit passes its tests on every supported Python, and put the
# release where a visitor sees it, with the notes for that version.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # required to create the release

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Run the tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -t .

  publish:
    needs: test          # never release a tag whose tests did not pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag must match fleet.__version__
        # A tag that disagrees with the version in the tree is worse than no tag:
        # every later "which version is this?" gets a confident wrong answer.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HAVE="$(python3 -c 'import fleet; print(fleet.__version__)')"
          echo "tag=$TAG  fleet.__version__=$HAVE"
          test "$TAG" = "$HAVE"

      - name: Extract the notes for this version
        run: |
          python3 scripts/changelog_notes.py "${GITHUB_REF_NAME}" > NOTES.md
          echo "--- notes ---"; cat NOTES.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "fleet $GITHUB_REF_NAME" \
            --notes-file NOTES.md \
            --verify-tag
