# Example fleet configuration. Copy to ~/.config/fleet/fleet.toml and edit.
# (or set FLEET_CONFIG to the directory holding it)
#
# This file holds what a human DECLARES about a fleet. Anything the tools OBSERVE
# at runtime -- manifests, watcher registrations, re-arm ledgers -- lives under
# [paths].state instead. Keep those apart: a record of observed state kept by
# hand is exactly what rots.

# How sessions refer to the human they work for. fleetwaiting builds its "blocked
# on the human" patterns from these; "the human" and "the user" always count.
[human]
name    = "Alex"
aliases = []                                      # other words sessions use, e.g. a role
timezone = "America/New_York"                     # fleetgantt's display zone
# timezone_file = "~/.local/state/fleet/tz"       # or: a file holding the current zone

[paths]
state       = "~/.local/state/fleet"
conventions = "~/.config/fleet/conventions.md"   # from examples/conventions.example.md

# fleetspawn: how a new session is launched. Briefs live in <config>/briefs/<name>.md.
[spawn]
env          = {}                                 # e.g. { NOTIFY_AGENT = "1" }
first_prompt = "You are a new fleet session named {name}. Read {brief} and follow it."

# Every member's colour, REQUIRED: fleetspawn refuses a session without one and
# fleetsnap/fleetupgrade flag a live colour that differs. /color accepts red, blue,
# green, yellow, purple, orange, pink, cyan. A /clear drops the colour and keeps the
# name, which is why the declaration lives here and not in a transcript.
[colors]
coordinator    = "purple"
project-a-repo = "red"
project-a-runs = "cyan"

# fleetcontext: when to recommend trimming a session's context. All optional.
[context]
compact_above = 250000                            # tokens; idle sessions above this: compact
clear_above   = 500000                            # repo/writing, clean, no runtime: clear candidate
idle_minutes  = 10                                # active more recently: later
compact_focus = "keep job ids, file paths, open decisions and commitments"

# fleetnudge: the phone push sent when a watcher's line cannot be delivered.
# The topic is read from a file -- the topic alone, or a script with a TOPIC="..."
# line, so an existing notification hook stays the one place it is written.
# [notify]
# ntfy_server     = "https://ntfy.sh"
# ntfy_topic_file = "~/.claude/hooks/ntfy-notify.sh"
# mute_file       = "~/.claude/ntfy-off"             # exists -> no push

# fleetmail: this fleet's identity in a shared mailbox with another person's fleet.
# [mail]
# fleet = "mygroup"                                 # addresses read <fleet>/<session>
# repo  = "git@github.com:myorg/fleet-mail.git"     # who may write is decided there
# clone = "~/.local/state/fleet/mailbox"            # the default

# Sessions stopped with fleetretire. Keyed by transcript: fleetrestore will not
# relaunch a listed uuid; a new session that reuses the name is unaffected.
# [parked.project-a-runs]
# uuid  = "<resume uuid>"
# since = "2026-09-13"
# note  = "resume when the next campaign starts"
# group = "project-a"                              # optional: keeps its fleetgantt lane
# cwd   = "/home/me/project-a-runs"                # optional: places its unnamed transcripts

[cluster.mycluster]
ssh_host        = "mycluster"            # an ssh alias that works non-interactively
user            = "myuser"
scheduler       = "slurm"
job_id_re       = "[0-9]{6,9}"           # the SHAPE of a job id on this scheduler
held_reasons    = ["JobHeldUser", "JobHeldAdmin"]
rate_usd_per_su = 0.01

[[cluster.mycluster.accounts]]
name        = "mygroup-billed"
qos         = "normal"
billed      = true
cost_center = "000000-0000"

[[cluster.mycluster.accounts]]
name   = "mygroup-free"
qos    = "free"
billed = false

# WorkDir fragment -> owning session. FIRST MATCH WINS: specific before general.
# An unmatched path is reported UNATTRIBUTED, never guessed.
[owners]
"/project-a-sweep" = "project-a-runs"
"/project-a"       = "project-a-repo"
